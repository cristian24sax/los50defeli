<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Invitación · 50 años de Felicitas</title>
<style>
@page { size: 150mm 220mm; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #fcfaf5; color: #504339; font-family: Georgia, serif; }
.card { width: 150mm; height: 220mm; position: relative; overflow: hidden; padding: 14mm 14mm 10mm; text-align: center; }
.card::before { content: ''; position: absolute; inset: 6mm; border: 1px solid #c6ac64; pointer-events: none; }
.card::after { content: ''; position: absolute; inset: 8mm; border: 1px solid #e6dcc1; pointer-events: none; }
.flowers { position: absolute; width: 57mm; height: 43mm; object-fit: cover; opacity: .15; top: 0; right: 0; mask-image: linear-gradient(215deg, black, transparent 80%); }
.eyebrow { font: 10px Calibri, sans-serif; letter-spacing: 3px; text-transform: uppercase; color: #8d7843; margin: 6mm 0 5mm; }
.intro { font-size: 16px; margin: 0; }
.number { font-size: 104px; line-height: 1; color: #b3974f; margin-top: 3mm; }
.years { font: 12px Calibri, sans-serif; letter-spacing: 8px; color: #8d7843; padding-left: 8px; }
h1 { font: 64px Gabriola, Georgia, serif; color: #a16d65; line-height: 1.3; margin: 1mm 0 0; font-weight: normal; }
.quote { font-size: 14px; font-style: italic; line-height: 1.6; margin: 0 auto 5mm; }
.divider { width: 36mm; height: 1px; background: #c6ac64; margin: 0 auto 6mm; }
.date { font-size: 21px; margin: 0 0 2mm; }
.time { font: 14px Calibri, sans-serif; letter-spacing: 2px; margin: 0 0 5mm; }
.label { font: 10px Calibri, sans-serif; letter-spacing: 3px; color: #94744e; margin: 0 0 2mm; }
.place { font-size: 22px; margin: 0 0 6mm; }
.button { display: block; width: 87mm; margin: 0 auto 3mm; padding: 3.5mm 0; border: 1px solid #b79a53; border-radius: 25px; text-decoration: none; color: #504339; font: bold 11px Calibri, sans-serif; letter-spacing: 1.5px; }
.primary { background: #a16d65; border-color: #a16d65; color: white; }
.hint { font: 10px Calibri, sans-serif; color: #877b6a; margin: 4mm 0 2mm; }
.farewell { font: 30px Gabriola, Georgia, serif; color: #a16d65; margin: 0; }
@media print { body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
</style>
<main class="card">
  <img class="flowers" src="retama.jpg" alt="">
  <p class="eyebrow">Una fecha para recordar</p>
  <p class="intro">Te invito a celebrar mis</p>
  <div class="number">50</div>
  <div class="years">AÑOS</div>
  <h1>Felicitas</h1>
  <p class="quote">Acompáñame a celebrar<br>este momento tan especial.</p>
  <div class="divider"></div>
  <p class="date">24 de octubre de 2026</p>
  <p class="time">8:00 P. M.</p>
  <p class="label">LUGAR</p>
  <p class="place">Local Matazango</p>
  <a class="button primary" href="https://www.google.com/maps?q=-12.07380639957765,-76.97107796226963&amp;z=19">VER UBICACIÓN EN EL MAPA</a>
  <!-- El enlace público de la web se añadirá cuando esté disponible. -->
  <p class="hint">Toca el botón para abrir la ubicación.</p>
  <p class="farewell">¡Te esperamos!</p>
</main>
</html>
